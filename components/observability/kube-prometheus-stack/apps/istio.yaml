apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: istio
  namespace: flux-system
spec:
  url: https://istio-release.storage.googleapis.com/charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: observability
spec:
  chart:
    spec:
      chart: base
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  interval: 5m
