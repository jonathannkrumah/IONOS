apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-jiva-default
provisioner: openebs.io/provisioner-iscsi
parameters:
  replicaCount: "3"
  storagePool: "default"
reclaimPolicy: Delete
volumeBindingMode: Immediate

---

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-cstor-disk
provisioner: cstor.csi.openebs.io
parameters:
  pool: "cstor-pool"
reclaimPolicy: Delete
volumeBindingMode: Immediate
