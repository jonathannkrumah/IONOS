---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
# apiVersion: source.toolkit.fluxcd.io/v1beta2
# kind: HelmRepository
# metadata:
#   name: bitnami
#   namespace: flux-system
# spec:
#   interval: 10m
#   url: https://charts.bitnami.com/bitnami

# components/wordpress/bitnami-oci.yaml
# components/wordpress/bitnami-helmrepository.yaml
# components/wordpress/bitnami-helmrepository.yaml
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bitnami
  namespace: flux-system
spec:
  type: oci
  url: oci://registry-1.docker.io/bitnamicharts
  interval: 1h
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wordpress
  namespace: wordpress
spec:
  interval: 5m
  chart:
    spec:
      chart: wordpress
      version: 23.1.0
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      interval: 1m

  values:
    image:
      registry: docker.io
      repository: bitnami/wordpress
      tag: "6.4.2" 

    mariadb:
      enabled: true
      auth:
        rootPasswordExistingSecret: wordpress-secret
        rootPasswordKey: mariadb-root-password
        passwordExistingSecret: wordpress-secret
        passwordKey: mariadb-password
      primary:
        persistence:
          enabled: true
          size: 20Gi
          storageClass: gp3 
          accessModes:
            - ReadWriteOnce
      image:
        registry: docker.io
        repository: bitnami/mariadb
        tag: "11.2.2" 
    # WordPress credentials from secret
    wordpressPassword: ""
    existingSecret: wordpress-secret
    existingSecretPasswordKey: wordpress-password

    wordpressUsername: ionos
    wordpressEmail: nkrumahjonathan61@gmail.com

    persistence:
      enabled: true
      size: 20Gi
      storageClass: gp3

    service:
      type: LoadBalancer

    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m